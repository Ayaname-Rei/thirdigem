<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>iGEM Opening Animation</title>
    <style>
      :root {
        --bg0: #0a1b28;
        --bg1: #102535;
        --bg2: #173142;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 52%, var(--bg2) 100%);
      }

      #stage {
        position: fixed;
        inset: 0;
        isolation: isolate;
        background:
          radial-gradient(circle at 18% 15%, rgba(47, 155, 228, 0.16), transparent 36%),
          radial-gradient(circle at 82% 18%, rgba(79, 192, 92, 0.14), transparent 38%),
          radial-gradient(circle at 50% 88%, rgba(255, 179, 0, 0.08), transparent 42%),
          linear-gradient(160deg, #0a1b28 0%, #102535 52%, #173142 100%);
      }

      #stage.exiting {
        animation: stage-out 720ms cubic-bezier(0.25, 0.08, 0.22, 1) forwards;
      }

      @keyframes stage-out {
        0% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0px) brightness(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.02);
          filter: blur(1.5px) brightness(1.04);
        }
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #cvBg { z-index: 1; }
      #cvFx { z-index: 2; }

    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="cvBg"></canvas>
      <canvas id="cvFx"></canvas>
    </div>

    <script>
      (() => {
        'use strict';

        const TIMING = {
          intro: 460,
          hold: 2000,
          move: 1100,
          settle: 800,
          dissolve: 1000,
          exit: 720,
        };

        const AT = {};
        AT.intro = 0;
        AT.hold = AT.intro + TIMING.intro;
        AT.move = AT.hold + TIMING.hold;
        AT.settle = AT.move + TIMING.move;
        AT.dissolve = AT.settle + TIMING.settle;
        AT.exit = AT.dissolve + TIMING.dissolve;

        const stage = document.getElementById('stage');

        const cvBg = document.getElementById('cvBg');
        const cvFx = document.getElementById('cvFx');
        let ctxBg = null;
        let ctxFx = null;

        let W = 0;
        let H = 0;
        let DPR = 1;

        let raf = 0;
        let start = 0;
        let prev = 0;
        let done = false;

        const logo = { img: null, ready: false, size: 0 };
        const particles = [];

        const clamp = (v, mn, mx) => Math.min(mx, Math.max(mn, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeOut = (t) => 1 - Math.pow(1 - t, 3);
        const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
        const rand = (a, b) => a + Math.random() * (b - a);

        function loadLogo() {
          if (logo.img) return;
          const img = new Image();
          img.decoding = 'async';
          img.onload = () => {
            logo.ready = true;
            logo.img = img;
          };
          img.src = new URL('brand-mark.svg', window.location.href).toString();
          logo.img = img;
        }

        function getStartPos() {
          return { x: W * 0.5, y: H * 0.5 };
        }

        function getFusionSpec() {
          const fallback = {
            x: W < 900 ? W * 0.5 : Math.max(102, Math.min(230, W * 0.16)),
            y: W < 900 ? 78 : 66,
            size: W < 900 ? 110 : 128,
          };

          try {
            const doc = window.parent?.document;
            if (!doc) return fallback;

            const target =
              doc.querySelector('.logo-icon img') ||
              doc.querySelector('.logo-icon svg') ||
              doc.querySelector('.logo-icon');
            if (!target) return fallback;

            const rect = target.getBoundingClientRect();
            if (!rect || !(rect.width > 0) || !(rect.height > 0)) return fallback;

            return {
              x: rect.left + rect.width * 0.5,
              y: rect.top + rect.height * 0.5,
              size: Math.max(56, Math.min(180, Math.min(rect.width, rect.height) * 1.04)),
            };
          } catch {
            return fallback;
          }
        }

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;

          [cvBg, cvFx].forEach((cv) => {
            cv.width = W * DPR;
            cv.height = H * DPR;
            cv.style.width = `${W}px`;
            cv.style.height = `${H}px`;
          });

          ctxBg = cvBg.getContext('2d');
          ctxFx = cvFx.getContext('2d');
          ctxBg.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctxFx.setTransform(DPR, 0, 0, DPR, 0, 0);

          logo.size = W < 900 ? 132 : 168;
          rebuildParticles();
        }

        function rebuildParticles() {
          particles.length = 0;
          const count = Math.min(120, Math.max(58, Math.floor((W * H) / 18000)));
          const c = getStartPos();
          for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2);
            const r = rand(28, 170);
            const x = c.x + Math.cos(a) * r;
            const y = c.y + Math.sin(a) * r;
            particles.push({
              x,
              y,
              r: rand(0.9, 2.1),
              a,
              orbit: r,
              speed: rand(0.0005, 0.0014),
              twinkle: rand(0, Math.PI * 2),
              trail: Array.from({ length: 4 }, () => ({ x, y })),
            });
          }
        }

        function drawBackground(t) {
          const c = ctxBg;
          c.clearRect(0, 0, W, H);

          const g = c.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, '#0a1b28');
          g.addColorStop(0.52, '#102535');
          g.addColorStop(1, '#173142');
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);

          const driftA = Math.sin(t * 0.00022);
          const driftB = Math.cos(t * 0.00018);
          const driftC = Math.sin(t * 0.00027 + 1.2);

          const glow1 = c.createRadialGradient(
            W * (0.24 + driftA * 0.03),
            H * (0.28 + driftB * 0.02),
            0,
            W * (0.24 + driftA * 0.03),
            H * (0.28 + driftB * 0.02),
            Math.min(W, H) * 0.48,
          );
          glow1.addColorStop(0, 'rgba(80, 190, 255, 0.14)');
          glow1.addColorStop(1, 'rgba(80,190,255,0)');
          c.fillStyle = glow1;
          c.fillRect(0, 0, W, H);

          const glow2 = c.createRadialGradient(
            W * (0.78 + driftB * 0.028),
            H * (0.24 + driftC * 0.02),
            0,
            W * (0.78 + driftB * 0.028),
            H * (0.24 + driftC * 0.02),
            Math.min(W, H) * 0.42,
          );
          glow2.addColorStop(0, 'rgba(88, 216, 125, 0.12)');
          glow2.addColorStop(1, 'rgba(88,216,125,0)');
          c.fillStyle = glow2;
          c.fillRect(0, 0, W, H);

          const fogBands = 4;
          for (let i = 0; i < fogBands; i++) {
            const yBase = H * (0.2 + i * 0.18);
            const sway = Math.sin(t * 0.0007 + i * 1.13) * 16;
            c.strokeStyle = `rgba(138, 210, 230, ${0.035 - i * 0.006})`;
            c.lineWidth = 22 - i * 4;
            c.beginPath();
            for (let x = -24; x <= W + 24; x += 20) {
              const y = yBase + Math.sin(x * 0.006 + t * 0.0009 + i * 0.7) * (7 + i * 1.5) + sway;
              if (x === -24) c.moveTo(x, y);
              else c.lineTo(x, y);
            }
            c.stroke();
          }

          c.strokeStyle = 'rgba(127, 190, 220, 0.06)';
          c.lineWidth = 1;
          const grid = 64;
          const ox = ((t * 0.01) % grid);
          for (let x = -grid; x < W + grid; x += grid) {
            c.beginPath();
            c.moveTo(x + ox, 0);
            c.lineTo(x + ox, H);
            c.stroke();
          }

          const vignette = c.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.25, W * 0.5, H * 0.48, Math.max(W, H) * 0.78);
          vignette.addColorStop(0, 'rgba(0,0,0,0)');
          vignette.addColorStop(1, 'rgba(0,0,0,0.34)');
          c.fillStyle = vignette;
          c.fillRect(0, 0, W, H);
        }

        function drawLogoAndFx(t, dt) {
          const c = ctxFx;
          c.clearRect(0, 0, W, H);

          const introP = clamp((t - AT.intro) / TIMING.intro, 0, 1);
          const moveP = clamp((t - AT.move) / TIMING.move, 0, 1);
          const settleP = clamp((t - AT.settle) / TIMING.settle, 0, 1);
          const dissolveP = clamp((t - AT.dissolve) / TIMING.dissolve, 0, 1);

          const from = getStartPos();
          const fusion = getFusionSpec();
          const k = easeInOut(moveP);

          const lx = lerp(from.x, fusion.x, k);
          const ly = lerp(from.y, fusion.y, k);
          const fusedOversize = fusion.size * 1.26;
          const moveSize = lerp(logo.size, fusedOversize, k);
          const settleSize = lerp(moveSize, fusion.size * 1.08, easeOut(settleP));
          const ls = lerp(settleSize, fusion.size * 0.88, easeInOut(dissolveP));
          const fxFade = 1 - dissolveP * 0.88;

          const pulse = 1 + Math.sin(t * 0.006) * 0.03 * (1 - moveP * 0.7);
          const auraR = ls * (0.7 + introP * 0.5);
          const spin = t * 0.0012;
          const revealP = clamp((introP - 0.2) / 0.8, 0, 1);

          const aura = c.createRadialGradient(lx, ly, 0, lx, ly, auraR * 1.35);
          aura.addColorStop(0, `rgba(83, 200, 255, ${(0.24 + introP * 0.1) * fxFade})`);
          aura.addColorStop(0.52, `rgba(86, 216, 124, ${(0.18 + introP * 0.06) * fxFade})`);
          aura.addColorStop(1, 'rgba(86,216,124,0)');
          c.fillStyle = aura;
          c.beginPath();
          c.arc(lx, ly, auraR * 1.35, 0, Math.PI * 2);
          c.fill();

          for (let i = 0; i < 3; i++) {
            const rp = ((t * 0.0012 + i * 0.33) % 1);
            const rr = ls * (0.64 + rp * 0.7);
            c.strokeStyle = `rgba(120, 225, 255, ${0.28 * (1 - rp) * fxFade})`;
            c.lineWidth = 1.5 - rp * 0.5;
            c.beginPath();
            c.arc(lx, ly, rr, 0, Math.PI * 2);
            c.stroke();
          }

          // Segmented HUD rings for richer motion detail
          for (let ring = 0; ring < 2; ring++) {
            const baseR = ls * (0.92 + ring * 0.18);
            const segCount = ring === 0 ? 10 : 14;
            const gap = 0.11;
            const ringRot = spin * (ring === 0 ? 1 : -0.7);
            c.lineWidth = ring === 0 ? 1.6 : 1.1;

            for (let s = 0; s < segCount; s++) {
              const a0 = ringRot + (Math.PI * 2 * s) / segCount + gap;
              const a1 = ringRot + (Math.PI * 2 * (s + 1)) / segCount - gap * 1.4;
              const alpha = (0.18 + 0.18 * Math.sin(t * 0.002 + s)) * fxFade * revealP;
              c.strokeStyle = ring === 0
                ? `rgba(122, 234, 255, ${alpha})`
                : `rgba(120, 255, 191, ${alpha * 0.85})`;
              c.beginPath();
              c.arc(lx, ly, baseR, a0, a1);
              c.stroke();
            }
          }

          // Orbiting satellite sparks
          for (let i = 0; i < 4; i++) {
            const a = spin * (0.9 + i * 0.12) + i * (Math.PI * 0.5);
            const r = ls * (1.12 + (i % 2) * 0.2);
            const sx = lx + Math.cos(a) * r;
            const sy = ly + Math.sin(a) * r * 0.82;
            const satAlpha = (0.5 + 0.5 * Math.sin(t * 0.005 + i)) * 0.7 * fxFade * revealP;

            c.strokeStyle = `rgba(134, 245, 255, ${satAlpha * 0.7})`;
            c.lineWidth = 1;
            c.beginPath();
            c.moveTo(lx + Math.cos(a) * (r - 16), ly + Math.sin(a) * (r - 16) * 0.82);
            c.lineTo(sx, sy);
            c.stroke();

            c.fillStyle = `rgba(202, 255, 246, ${satAlpha})`;
            c.beginPath();
            c.arc(sx, sy, 1.8 + (i % 2) * 0.6, 0, Math.PI * 2);
            c.fill();
          }

          // Horizontal light sweep crossing the logo zone
          const sweepX = lx - ls + (((t * 0.28) % (ls * 2.4)));
          const beam = c.createLinearGradient(sweepX - 22, ly, sweepX + 22, ly);
          beam.addColorStop(0, `rgba(120,230,255,0)`);
          beam.addColorStop(0.5, `rgba(186,255,237,${0.22 * fxFade * revealP})`);
          beam.addColorStop(1, `rgba(120,230,255,0)`);
          c.fillStyle = beam;
          c.fillRect(lx - ls * 0.62, ly - ls * 0.54, ls * 1.24, ls * 1.08);

          // Peripheral outer effects (outside the logo body)
          const outerR = ls * 1.75;
          const outerR2 = ls * 2.15;

          // Large orbit arcs around the subject
          c.lineWidth = 1.2;
          c.strokeStyle = `rgba(124, 222, 255, ${0.2 * fxFade * revealP})`;
          c.beginPath();
          c.ellipse(lx, ly, outerR2, outerR * 0.86, spin * 0.42, 0.2, Math.PI * 1.45);
          c.stroke();

          c.strokeStyle = `rgba(124, 255, 182, ${0.16 * fxFade * revealP})`;
          c.beginPath();
          c.ellipse(lx, ly, outerR * 0.94, outerR2 * 0.6, -spin * 0.36, Math.PI * 0.58, Math.PI * 1.86);
          c.stroke();

          // Peripheral nodes + links
          const nodeCount = 7;
          const nodes = [];
          for (let i = 0; i < nodeCount; i++) {
            const a = spin * (0.32 + i * 0.03) + (Math.PI * 2 * i) / nodeCount;
            const nr = i % 2 === 0 ? outerR : outerR2 * 0.92;
            const nx = lx + Math.cos(a) * nr;
            const ny = ly + Math.sin(a) * nr * 0.78;
            nodes.push({ x: nx, y: ny });

            const na = (0.26 + 0.28 * Math.sin(t * 0.003 + i)) * fxFade * revealP;
            c.fillStyle = `rgba(179, 247, 255, ${na})`;
            c.beginPath();
            c.arc(nx, ny, 1.6 + (i % 3) * 0.5, 0, Math.PI * 2);
            c.fill();
          }

          c.lineWidth = 0.9;
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            const b = nodes[(i + 2) % nodes.length];
            const alpha = (0.08 + 0.06 * Math.sin(t * 0.002 + i * 0.9)) * fxFade * revealP;
            c.strokeStyle = `rgba(117, 217, 255, ${alpha})`;
            c.beginPath();
            c.moveTo(a.x, a.y);
            c.lineTo(b.x, b.y);
            c.stroke();
          }

          // Small electric streaks in the outer field
          for (let i = 0; i < 3; i++) {
            const phase = (t * 0.0022 + i * 0.31) % 1;
            const a = phase * Math.PI * 2 + i * 1.7;
            const sr = outerR2 * (0.86 + i * 0.08);
            const x1 = lx + Math.cos(a) * sr;
            const y1 = ly + Math.sin(a) * sr * 0.76;
            const x2 = lx + Math.cos(a + 0.08) * (sr + 18);
            const y2 = ly + Math.sin(a + 0.08) * (sr + 18) * 0.76;
            const x3 = lx + Math.cos(a + 0.16) * (sr + 6);
            const y3 = ly + Math.sin(a + 0.16) * (sr + 6) * 0.76;
            const ea = (0.18 + (1 - phase) * 0.22) * fxFade * revealP;

            c.strokeStyle = `rgba(154, 255, 219, ${ea})`;
            c.lineWidth = 1;
            c.beginPath();
            c.moveTo(x1, y1);
            c.lineTo(x2, y2);
            c.lineTo(x3, y3);
            c.stroke();
          }

          // Left/right side feature clusters to enrich composition balance
          const sideYOffset = Math.sin(t * 0.0016) * 10;
          const sideDist = ls * 2.95;
          const sideY = ly + sideYOffset;
          const leftX = lx - sideDist;
          const rightX = lx + sideDist;

          const drawSideCluster = (sx, dir, tintA, tintB) => {
            const coreA = (0.2 + 0.18 * Math.sin(t * 0.002 + sx * 0.003)) * fxFade * revealP;

            // vertical beacon
            c.strokeStyle = `rgba(${tintA}, ${coreA})`;
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(sx, sideY - ls * 0.58);
            c.lineTo(sx, sideY + ls * 0.58);
            c.stroke();

            // side arcs
            c.strokeStyle = `rgba(${tintB}, ${coreA * 0.88})`;
            c.lineWidth = 1.1;
            c.beginPath();
            c.ellipse(sx, sideY, ls * 0.34, ls * 0.56, dir * 0.32 + spin * 0.18, Math.PI * 0.24, Math.PI * 1.76);
            c.stroke();

            c.beginPath();
            c.ellipse(sx + dir * ls * 0.11, sideY, ls * 0.18, ls * 0.36, -dir * 0.24 - spin * 0.24, Math.PI * 0.16, Math.PI * 1.84);
            c.stroke();

            // floating side nodes
            for (let j = 0; j < 4; j++) {
              const pa = t * 0.0014 + j * 1.15 + (dir > 0 ? 0.6 : 0);
              const nx = sx + Math.cos(pa) * ls * (0.2 + j * 0.04) + dir * ls * 0.08;
              const ny = sideY + Math.sin(pa * 1.22) * ls * (0.3 + j * 0.06);
              const na = (0.18 + 0.24 * Math.sin(t * 0.003 + j)) * fxFade * revealP;

              c.fillStyle = `rgba(${tintA}, ${na})`;
              c.beginPath();
              c.arc(nx, ny, 1.3 + j * 0.22, 0, Math.PI * 2);
              c.fill();

              c.strokeStyle = `rgba(${tintB}, ${na * 0.55})`;
              c.lineWidth = 0.8;
              c.beginPath();
              c.moveTo(sx, sideY);
              c.lineTo(nx, ny);
              c.stroke();
            }
          };

          drawSideCluster(leftX, -1, '151, 226, 255', '137, 255, 206');
          drawSideCluster(rightX, 1, '151, 226, 255', '137, 255, 206');

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.a += p.speed * dt;
            const orb = p.orbit * (1 - moveP * 0.75) * (1 - dissolveP * 0.6);
            p.x = lx + Math.cos(p.a + i * 0.015) * orb;
            p.y = ly + Math.sin(p.a + i * 0.015) * orb * 0.74;

            p.trail.pop();
            p.trail.unshift({ x: p.x, y: p.y });

            for (let j = 1; j < p.trail.length; j++) {
              const a = 0.34 * ((p.trail.length - j) / p.trail.length) * fxFade;
              c.strokeStyle = `rgba(91, 225, 255, ${a})`;
              c.lineWidth = 0.8;
              c.beginPath();
              c.moveTo(p.trail[j - 1].x, p.trail[j - 1].y);
              c.lineTo(p.trail[j].x, p.trail[j].y);
              c.stroke();
            }

            const tw = 0.55 + Math.sin(t * 0.005 + p.twinkle) * 0.45;
            c.fillStyle = `rgba(178, 248, 255, ${(0.45 + tw * 0.45) * fxFade})`;
            c.beginPath();
            c.arc(p.x, p.y, p.r * (0.8 + tw * 0.4), 0, Math.PI * 2);
            c.fill();
          }

          const logoAlpha = (0.2 + revealP * 0.8) * (1 - dissolveP * 0.92);

          c.save();
          c.translate(lx, ly);
          c.scale(pulse, pulse);
          c.globalAlpha = logoAlpha;
          if (logo.ready && logo.img) {
            c.drawImage(logo.img, -ls * 0.5, -ls * 0.5, ls, ls);
          } else {
            c.fillStyle = 'rgba(180, 245, 255, 0.85)';
            c.beginPath();
            c.arc(0, 0, ls * 0.2, 0, Math.PI * 2);
            c.fill();
          }
          // Subtle dual-tone edge glows around logo for depth
          c.globalCompositeOperation = 'screen';
          c.shadowBlur = 12;
          c.shadowColor = `rgba(102, 234, 255, ${0.38 * fxFade})`;
          c.strokeStyle = `rgba(120, 230, 255, ${0.28 * fxFade})`;
          c.lineWidth = 1.2;
          c.strokeRect(-ls * 0.5, -ls * 0.5, ls, ls);
          c.shadowColor = `rgba(120, 255, 186, ${0.3 * fxFade})`;
          c.strokeStyle = `rgba(120, 255, 186, ${0.22 * fxFade})`;
          c.strokeRect(-ls * 0.48, -ls * 0.48, ls * 0.96, ls * 0.96);
          c.restore();

          const scanP = ((t * 0.0016) % 1);
          const y = ly - ls * 0.5 + scanP * ls;
          c.strokeStyle = `rgba(173, 255, 215, ${0.35 * (1 - Math.abs(scanP - 0.5) * 2) * fxFade})`;
          c.lineWidth = 1.2;
          c.beginPath();
          c.moveTo(lx - ls * 0.5, y);
          c.lineTo(lx + ls * 0.5, y);
          c.stroke();
        }

        function finish() {
          stage.style.display = 'none';
          document.body.style.overflow = 'auto';
          try {
            window.parent?.postMessage({ type: 'IGEM_SPLASH_DONE' }, '*');
          } catch {}
          window.dispatchEvent(new Event('IGEM_SPLASH_DONE'));
        }

        function triggerExit() {
          if (done) return;
          done = true;
          if (raf) cancelAnimationFrame(raf);
          stage.classList.add('exiting');
          setTimeout(finish, TIMING.exit + 40);
        }

        function frame(now) {
          if (done) return;
          if (!start) {
            start = now;
            prev = now;
          }

          const t = now - start;
          const dt = Math.min(40, now - prev);
          prev = now;

          drawBackground(t);
          drawLogoAndFx(t, dt);

          if (t >= AT.exit) {
            triggerExit();
            return;
          }

          raf = requestAnimationFrame(frame);
        }

        function init() {
          done = false;
          start = 0;
          prev = 0;
          stage.classList.remove('exiting');
          if (raf) cancelAnimationFrame(raf);
          resize();
          raf = requestAnimationFrame(frame);
        }

        let resizeTimer = 0;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(init, 120);
        });

        loadLogo();
        init();
      })();
    </script>
  </body>
</html>
